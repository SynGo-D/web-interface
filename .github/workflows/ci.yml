name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lint first: the React Compiler rules catch the mistakes that only
      # show up as a render loop in the browser.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  image:
    name: Container image
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: web-interface:${{ github.sha }}
          # NEXT_PUBLIC_* values are inlined into the client bundle at
          # build time, so the real API address has to be known here, not
          # at `docker run`. CI builds against the default; the deployment
          # workflow passes the deployed one.
          build-args: |
            NEXT_PUBLIC_MAIN_BACKEND_URL=http://localhost:5000
          cache-from: type=gha
          cache-to: type=gha,mode=max
